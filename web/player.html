<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - Kineflex</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #playerError {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e50914;
            font-size: 1.5rem;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 1rem 2rem;
            border-radius: 4px;
            text-align: center;
        }
        /* Minimal custom controls could be added here, but for native TV support and minimalism, we can use native controls or a simple overlay */
    </style>
    <!-- Include hls.js for HLS playback without huge player libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
    <div id="videoContainer">
        <!-- Using native controls for simplicity and TV-friendliness as requested for minimalism, or we can build custom ones. The prompt allows basic HTML5 video. -->
        <video id="videoPlayer" controls autoplay></video>
        <div id="playerError"></div>
    </div>
    <script src="/js/player.js"></script>
</body>
</html>
