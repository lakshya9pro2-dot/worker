<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - Kineflex</title>

    <!-- Icons used by the custom UI controls (ported from player2.html) -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            color: #fff;
            font-family: "Montserrat", sans-serif;
            overflow: hidden;
        }

        /* ============================================================
           Custom player skin (ported 1:1 from player2.html), retargeted
           from the JW Player mount div to the native <video> element.
        ============================================================ */
        .video-container {
          width: 100vw;
          height: 100vh;
          position: relative;
          color: #fff;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #000;
        }

        /* Native <video> fills the container completely, same as #video_player did */
        .video-container video {
          position: absolute;
          top: 0;
          left: 0;
          width: 100% !important;
          height: 100% !important;
          object-fit: contain;
          background: #000;
        }

        #playerError {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e50914;
            font-size: 1.5rem;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 1rem 2rem;
            border-radius: 4px;
            text-align: center;
            z-index: 10000;
        }

        .custom-loader {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 150px;
          height: 150px;
          z-index: 9999;
          object-fit: contain;
          display: none;
        }

        /* Top Controls */
        .top-controls {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          padding: 1.5rem 2rem;
          background: linear-gradient(to bottom, #000000e6 0%, transparent 100%);
          box-sizing: border-box;
          opacity: 0;
          transform: translateY(-40px);
          visibility: hidden;
          z-index: 99;
          transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 2rem;
        }

        .top-controls.show-controls {
          opacity: 1;
          transform: translateY(0);
          visibility: visible;
        }

        .player-info {
          display: none;
          align-items: center;
          gap: 0.6rem;
          margin-right: auto;
          min-width: 0;
        }

        .player-info.show {
          display: flex;
        }

        .player-logo {
          height: 28px;
          display: none;
        }

        .player-title {
          font-weight: 600;
          font-size: 1rem;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .top-control-item {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          cursor: pointer;
          font-size: 0.95rem;
          font-weight: 500;
          transition: opacity 0.2s;
          user-select: none;
          position: relative;
        }

        .top-control-item:hover {
          opacity: 0.8;
        }

        .top-control-item ion-icon {
          font-size: 1.4rem;
        }

        /* Player State Buttons (big play/pause + seek feedback icons) */
        .player-state {
          display: flex;
          position: absolute;
          width: 100%;
          justify-content: space-around;
          align-items: center;
          z-index: 50;
        }

        .state-btn {
          font-size: 2.3rem;
          width: 80px;
          height: 80px;
          cursor: pointer;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
          background: rgba(36, 36, 36, 0.667);
          z-index: 9999;
          opacity: 0;
          user-select: none;
          transform: scale(0);
        }

        .state-forward,
        .state-backward {
          font-size: 1.5rem;
        }

        .state-forward .forward-duration {
          margin-right: 0.5rem;
        }

        .state-backward .backward-duration {
          margin-left: 0.5rem;
        }

        .animate-state {
          animation: playPause 0.5s forwards;
        }

        .show-state {
          transform: scale(1);
          opacity: 1;
        }

        .show-controls {
          opacity: 1 !important;
          transform: translateY(0) !important;
          visibility: visible !important;
        }

        /* Bottom Controls */
        .controls {
          position: absolute;
          bottom: 0;
          left: 0;
          padding: 5rem 1rem 0.5rem 1rem;
          width: 100%;
          background: linear-gradient(to top, #000000b8 -100%, transparent);
          box-sizing: border-box;
          opacity: 0;
          transform: translateY(40px);
          visibility: hidden;
          z-index: 99;
          transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          user-select: none;
        }

        .duration {
          position: relative;
          width: 100%;
          height: 15px;
          background: #62626274;
          cursor: pointer;
          transition: all 0.2s;
        }

        .duration:hover {
          height: 17px;
        }

        .duration .buffer {
          height: 100%;
          position: absolute;
          inset: 0;
          background-color: #ff6a0045;
          z-index: 9;
          width: 0;
        }

        .hover-time {
          height: 100%;
          position: absolute;
          inset: 0;
          background: #ffffff9a;
          z-index: 99;
          display: flex;
          align-items: center;
          width: 0;
        }

        .hover-time .hover-duration {
          position: absolute;
          right: calc((-25px / 2));
          top: -25px;
          background: #3c3c3ca7;
          padding: 0.2rem;
          border-radius: 5px;
          font-size: 0.7rem;
          visibility: hidden;
          font-weight: bold;
          opacity: 0;
          transform: scale(0);
        }

        .duration:hover .hover-time .hover-duration {
          visibility: visible;
          opacity: 1;
          transition: all 0.2s;
          transform: scale(1);
        }

        .duration .current-time {
          height: 100%;
          position: absolute;
          inset: 0;
          background: #ff6a00;
          z-index: 999;
          display: flex;
          align-items: center;
          width: 0;
        }

        .current-time::before {
          content: "";
          position: absolute;
          right: calc((-25px / 2));
          background: #ff6a00;
          width: 25px;
          height: 25px;
          border-radius: 50%;
          transition: all 0.2s;
          visibility: hidden;
          transform: scale(0);
        }

        .duration:hover .current-time::before {
          visibility: visible;
          transform: scale(1);
        }

        .btn-controls {
          padding-top: 1rem;
          font-size: 1.2rem;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .btn-con {
          display: flex;
          align-items: center;
        }

        .btn-con,
        .btn-controls > span {
          cursor: pointer;
        }

        .play-pause {
          display: flex;
          margin-right: 0.5rem;
        }

        .control-btn {
          width: 2.2rem;
          height: 2.2rem;
          border-radius: 50%;
          background: #33333372;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid transparent;
          box-sizing: border-box;
          position: relative;
          margin-right: 0.5rem;
        }

        .control-btn:last-child {
          margin-right: 0;
        }

        .control-btn:hover {
          border: 1px solid #3131315c;
        }

        .control-btn::before {
          content: "";
          display: block;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          background: #2424246a;
          position: absolute;
          transition: all 0.1s;
          transform: scale(0);
        }

        .control-btn:active::before {
          transform: scale(1);
          border: 1px solid #3131315c;
        }

        .time-container {
          font-size: 13px;
          font-weight: 500;
          padding-left: 0.7rem;
        }

        .volume {
          display: flex;
          align-items: center;
          cursor: default;
        }

        .mute-unmute {
          display: flex;
          cursor: pointer;
        }

        .max-vol {
          height: 3px;
          cursor: pointer;
          background: #ffffff6e;
          transition: all 0.1s;
          width: 0;
          visibility: hidden;
          transform: scaleX(0);
          transform-origin: left;
          display: flex;
          align-items: center;
        }

        .max-vol.show {
          width: 56px;
          visibility: visible;
          transform: scaleX(1);
        }

        .current-vol {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #fff;
          display: flex;
          transition: none;
          align-items: center;
        }

        .current-vol::before {
          content: "";
          position: absolute;
          right: -5px;
          width: 12px;
          height: 12px;
          display: block;
          border-radius: 50%;
          background: #eee;
        }

        /* Bottom settings dropdown (Quality + Speed) and top Audio/Subtitle dropdown share this look */
        .setting-menu,
        .subtitle-menu {
          opacity: 0;
          visibility: hidden;
          list-style: none;
          padding: 0;
          margin: 0;
          position: absolute;
          transition: all 0.2s;
          background: rgba(28, 28, 28, 0.95);
          transform: scaleY(0);
          border-radius: 5px;
          min-width: 200px;
          max-height: 260px;
          overflow-y: auto;
          z-index: 999;
        }

        .setting-menu {
          bottom: 4.5rem;
          transform-origin: bottom;
        }

        .subtitle-menu {
          top: 3.2rem;
          right: 0;
          transform-origin: top;
        }

        .setting-menu .menu-item,
        .subtitle-menu .menu-item {
          padding: 0.7rem 1.5rem;
          transition: all 0.2s;
          font-size: 0.9rem;
          font-weight: 500;
          cursor: pointer;
          border-bottom: 1px solid #1a1a1a;
        }

        .setting-menu .menu-header,
        .subtitle-menu .menu-header {
          padding: 0.5rem 1.5rem;
          font-size: 0.75rem;
          color: #999;
          text-transform: uppercase;
          letter-spacing: 1px;
          cursor: default;
          border-bottom: 1px solid #1a1a1a;
        }

        .speed-active,
        .quality-active,
        .sub-active {
          background: rgb(23, 23, 23);
        }

        .setting-menu .menu-item:hover,
        .subtitle-menu .menu-item:hover {
          background: rgb(31, 31, 31);
        }

        .setting-btn {
          display: flex;
        }

        .show-setting-menu {
          opacity: 1;
          transform: scaleY(1);
          visibility: visible;
        }

        .right-controls {
          display: flex;
          align-items: center;
        }

        .right-controls span {
          cursor: pointer;
        }

        .full,
        .contract {
          display: none;
        }

        .video-container:not(.fullscreen) .full {
          display: flex;
        }

        .video-container.fullscreen .contract {
          display: flex;
        }

        .fullscreen {
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          max-width: 100% !important;
          width: 100% !important;
          height: 100% !important;
          background: #000 !important;
        }

        @keyframes playPause {
          50% {
            opacity: 1;
            transform: scale(1.1);
          }
          100% {
            opacity: 0;
            transform: scale(1);
          }
        }
    </style>

    <!-- Include hls.js for HLS playback without huge player libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
    <div id="videoContainer" class="video-container">

        <!-- Top Controls -->
        <div class="top-controls">
          <div class="player-info" id="playerInfo">
            <img class="player-logo" id="playerLogo" alt="logo">
            <span class="player-title" id="playerTitle"></span>
          </div>

          <div class="top-control-item" id="speedControl">
            <ion-icon name="speedometer-outline"></ion-icon>
            <span>Speed (<span id="currentSpeed">1x</span>)</span>
          </div>
          <div class="top-control-item" id="lockControl">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <span>Lock</span>
          </div>
          <div class="top-control-item" id="audioSubControl" style="display:none;">
            <ion-icon name="chatbox-outline"></ion-icon>
            <span>Audio &amp; Subtitles</span>

            <!-- Populated live from the video's native text tracks, if any -->
            <ul class="subtitle-menu" id="subtitleMenu">
              <li class="menu-header">Subtitles</li>
              <div class="subtitle-list" id="subtitleList"></div>
            </ul>
          </div>
        </div>

        <!-- Native video element, still driven by /js/player.js + hls.js -->
        <video id="videoPlayer" autoplay playsinline></video>

        <img class="custom-loader" id="customLoader" src="https://vids.st/storage/thumbs/thumb-91548-1781948457.gif" alt="Loading...">

        <div class="player-state">
          <span class="state-btn state-backward">
            <ion-icon name="play-back-outline"></ion-icon>
            <span class="backward-duration">10</span>
          </span>
          <span class="main-state state-btn">
            <ion-icon name="play-outline"></ion-icon>
          </span>
          <span class="state-btn state-forward">
            <span class="forward-duration">10</span>
            <ion-icon name="play-forward-outline"></ion-icon>
          </span>
        </div>

        <div class="controls">
          <div class="duration">
            <div class="current-time"></div>
            <div class="hover-time"><span class="hover-duration"></span></div>
            <div class="buffer"></div>
          </div>
          <div class="btn-controls">
            <div class="btn-con">
              <span class="play-pause control-btn">
                <ion-icon name="play-outline"></ion-icon>
              </span>
              <span class="volume">
                <span class="mute-unmute control-btn">
                  <ion-icon name="volume-high-outline"></ion-icon>
                </span>
                <div class="max-vol"><div class="current-vol"></div></div>
              </span>
              <span class="time-container">
                <span class="current-duration">0:00</span> /
                <span class="total-duration">0:00</span>
              </span>
            </div>
            <div class="right-controls">
              <span class="backward control-btn">
                <ion-icon name="play-back-outline"></ion-icon>
              </span>
              <span class="forward control-btn">
                <ion-icon name="play-forward-outline"></ion-icon>
              </span>
              <span class="settings control-btn">
                <span class="setting-btn">
                  <ion-icon name="options-outline"></ion-icon>
                </span>
                <ul class="setting-menu" id="settingMenu">
                  <li class="menu-header" id="qualityHeader" style="display:none;">Quality</li>
                  <!-- Populated live from hls.js levels, if exposed by /js/player.js -->
                  <div class="quality-list" id="qualityList"></div>
                  <li class="menu-header">Playback Speed</li>
                  <div class="menu-item" data-value="0.25">0.25x</div>
                  <div class="menu-item" data-value="0.5">0.5x</div>
                  <div class="menu-item" data-value="0.75">0.75x</div>
                  <div class="menu-item speed-active" data-value="1">1x</div>
                  <div class="menu-item" data-value="1.25">1.25x</div>
                  <div class="menu-item" data-value="1.5">1.5x</div>
                  <div class="menu-item" data-value="1.75">1.75x</div>
                  <div class="menu-item" data-value="2">2x</div>
                </ul>
              </span>
              <span class="fullscreen-btn control-btn" id="fullscreenBtn">
                <span class="full">
                  <ion-icon name="scan-outline"></ion-icon>
                </span>
                <span class="contract">
                  <ion-icon name="contract-outline"></ion-icon>
                </span>
              </span>
            </div>
          </div>
        </div>

        <div id="playerError"></div>
    </div>

    <!-- Untouched: this file continues to load the source into #videoPlayer via hls.js -->
    <script src="/js/progress.js"></script>
    <script src="/js/player.js"></script>

    <!-- ============================================================
         Custom UI wiring only. This does NOT replace or duplicate
         anything /js/player.js does (no source loading, no Hls()
         instance is created here) — it only drives the skin above
         through the standard HTMLVideoElement API, so it works no
         matter how /js/player.js feeds the <video> element.
    ============================================================ -->
    <script>
    (function () {
      const video = document.getElementById("videoPlayer");
      if (!video) return;

      const videoContainer = document.querySelector(".video-container");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const playPauseBtn = document.querySelector(".play-pause");
      const volumeWrap = document.querySelector(".volume");
      const currentTimeBar = document.querySelector(".current-time");
      const durationBar = document.querySelector(".duration");
      const bufferBar = document.querySelector(".buffer");
      const totalDurationEl = document.querySelector(".total-duration");
      const currentDurationEl = document.querySelector(".current-duration");
      const controls = document.querySelector(".controls");
      const topControls = document.querySelector(".top-controls");
      const currentVol = document.querySelector(".current-vol");
      const totalVol = document.querySelector(".max-vol");
      const mainState = document.querySelector(".main-state");
      const muteUnmuteBtn = document.querySelector(".mute-unmute");
      const forwardBtn = document.querySelector(".forward");
      const backwardBtn = document.querySelector(".backward");
      const hoverTime = document.querySelector(".hover-time");
      const hoverDuration = document.querySelector(".hover-duration");
      const settingsBtn = document.querySelector(".setting-btn");
      const settingMenu = document.getElementById("settingMenu");
      const qualityHeader = document.getElementById("qualityHeader");
      const qualityList = document.getElementById("qualityList");
      const speedButtons = document.querySelectorAll(".setting-menu .menu-item[data-value]");
      const backwardState = document.querySelector(".state-backward");
      const forwardState = document.querySelector(".state-forward");
      const loader = document.getElementById("customLoader");
      const currentSpeedDisplay = document.getElementById("currentSpeed");
      const audioSubControl = document.getElementById("audioSubControl");
      const subtitleMenu = document.getElementById("subtitleMenu");
      const subtitleList = document.getElementById("subtitleList");

      let isPlaying = false,
          mouseDownProgress = false,
          mouseDownVol = false,
          isCursorOnControls = false,
          hideTimeout,
          mouseOverDuration = false,
          touchClientX = 0,
          touchPastDurationWidth = 0,
          touchStartTime = 0,
          isLocked = false;

      currentVol.style.width = (video.volume * 100) + "%";

      /* ---------- helpers ---------- */
      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function showDuration(time) {
        if (!isFinite(time) || isNaN(time)) return "0:00";
        const hours = Math.floor(time / 3600);
        const min = Math.floor((time / 60) % 60);
        const sec = Math.floor(time % 60);
        if (hours > 0) return `${pad(hours)}:${pad(min)}:${pad(sec)}`;
        return `${pad(min)}:${pad(sec)}`;
      }

      function updateMuteIcon() {
        muteUnmuteBtn.innerHTML = (video.muted || video.volume === 0)
          ? `<ion-icon name="volume-mute-outline"></ion-icon>`
          : `<ion-icon name="volume-high-outline"></ion-icon>`;
      }

      function handleMainStateIcon(icon) {
        mainState.classList.add("animate-state");
        mainState.innerHTML = icon;
      }

      function showPausedUI() {
        controls.classList.add("show-controls");
        topControls.classList.add("show-controls");
        mainState.classList.add("show-state");
        handleMainStateIcon(`<ion-icon name="play-outline"></ion-icon>`);
      }

      function hideControls() {
        if (hideTimeout) clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          if (isPlaying && !isCursorOnControls) {
            controls.classList.remove("show-controls");
            topControls.classList.remove("show-controls");
            settingMenu.classList.remove("show-setting-menu");
            subtitleMenu.classList.remove("show-setting-menu");
          }
        }, 1000);
      }

      function closeMenus(except) {
        [settingMenu, subtitleMenu].forEach((m) => {
          if (m !== except) m.classList.remove("show-setting-menu");
        });
      }

      function togglePlay() {
        if (video.paused || video.ended) video.play().catch(() => {});
        else video.pause();
      }

      function toggleMainState(e) {
        e.stopPropagation();
        if (!e.composedPath().includes(controls) && !e.composedPath().includes(topControls)) {
          togglePlay();
        }
      }

      function toggleMuteUnmute() {
        video.muted = !video.muted;
        if (!video.muted && video.volume === 0) video.volume = 1;
        updateMuteIcon();
        handleMainStateIcon(video.muted
          ? `<ion-icon name="volume-mute-outline"></ion-icon>`
          : `<ion-icon name="volume-high-outline"></ion-icon>`);
      }

      function navigate(e) {
        const rect = durationBar.getBoundingClientRect();
        const width = Math.min(Math.max(0, e.clientX - rect.x), rect.width);
        const fraction = width / rect.width;
        currentTimeBar.style.width = fraction * 100 + "%";
        if (video.duration) video.currentTime = fraction * video.duration;
      }

      function handleTouchNavigate(e) {
        hideControls();
        if (e.timeStamp - touchStartTime > 500) {
          const rect = durationBar.getBoundingClientRect();
          const clientX = e.changedTouches[0].clientX;
          const value = Math.min(
            Math.max(0, touchPastDurationWidth + (clientX - touchClientX) * 0.2),
            rect.width
          );
          currentTimeBar.style.width = value + "px";
          if (video.duration) {
            const fraction = value / rect.width;
            video.currentTime = fraction * video.duration;
            currentDurationEl.textContent = showDuration(fraction * video.duration);
          }
        }
      }

      function handleVolume(e) {
        const rect = totalVol.getBoundingClientRect();
        const width = Math.min(Math.max(0, e.clientX - rect.x), rect.width);
        currentVol.style.width = width + "px";
        const val = Math.min(Math.max(0, width / rect.width), 1);
        video.volume = val;
        video.muted = val === 0;
        updateMuteIcon();
      }

      function handleMousemove(e) {
        if (mouseDownProgress) { e.preventDefault(); navigate(e); }
        if (mouseDownVol) handleVolume(e);
        if (mouseOverDuration && video.duration) {
          const rect = durationBar.getBoundingClientRect();
          const width = Math.min(Math.max(0, e.clientX - rect.x), rect.width);
          const percent = (width / rect.width) * 100;
          hoverTime.style.width = width + "px";
          hoverDuration.textContent = showDuration((video.duration / 100) * percent);
        }
      }

      function handleForward() {
        forwardState.classList.add("show-state", "animate-state");
        if (video.duration) video.currentTime = Math.min(video.duration, video.currentTime + 10);
        else video.currentTime += 10;
      }

      function handleBackward() {
        backwardState.classList.add("show-state", "animate-state");
        video.currentTime = Math.max(0, video.currentTime - 10);
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          videoContainer.requestFullscreen();
          handleMainStateIcon(`<ion-icon name="scan-outline"></ion-icon>`);
        } else {
          handleMainStateIcon(`<ion-icon name="contract-outline"></ion-icon>`);
          document.exitFullscreen();
        }
      }

      function handlePlaybackRate(e) {
        const rate = parseFloat(e.currentTarget.dataset.value);
        video.playbackRate = rate;
        speedButtons.forEach((btn) => btn.classList.remove("speed-active"));
        e.currentTarget.classList.add("speed-active");
        settingMenu.classList.remove("show-setting-menu");
        currentSpeedDisplay.textContent = rate + "x";
        handleMainStateIcon(`<span style="font-size: 1.4rem">${rate}x</span>`);
      }

      function handlePlaybackRateKey(type = "") {
        let rate = video.playbackRate;
        if (type === "increase" && rate < 2) rate += 0.25;
        else if (rate > 0.25 && type !== "increase") rate -= 0.25;
        rate = Math.round(rate * 100) / 100;
        video.playbackRate = rate;
        handleMainStateIcon(`<span style="font-size: 1.4rem">${rate}x</span>`);
        currentSpeedDisplay.textContent = rate + "x";
        speedButtons.forEach((btn) => {
          btn.classList.remove("speed-active");
          if (parseFloat(btn.dataset.value) === rate) btn.classList.add("speed-active");
        });
      }

      function handleShorthand(e) {
        const tagName = document.activeElement.tagName.toLowerCase();
        if (tagName === "input") return;
        if (e.key.match(/[0-9]/) && video.duration) {
          const pct = parseInt(e.key, 10) * 10;
          video.currentTime = (video.duration / 100) * pct;
          currentTimeBar.style.width = pct + "%";
        }
        switch (e.key.toLowerCase()) {
          case " ":
            if (tagName === "button") return;
            togglePlay();
            break;
          case "f": toggleFullscreen(); break;
          case "arrowright": handleForward(); break;
          case "arrowleft": handleBackward(); break;
          case "m": toggleMuteUnmute(); break;
          case "+": handlePlaybackRateKey("increase"); break;
          case "-": handlePlaybackRateKey(); break;
          default: break;
        }
      }

      function handleLockScreen() {
        isLocked = !isLocked;
        const lockIcon = document.querySelector("#lockControl ion-icon");
        const lockText = document.querySelector("#lockControl span");

        if (isLocked) {
          lockIcon.setAttribute("name", "lock-closed");
          lockText.textContent = "Unlock";
          controls.style.pointerEvents = "none";
          topControls.style.pointerEvents = "auto";
          videoContainer.style.pointerEvents = "none";
          handleMainStateIcon(`<ion-icon name="lock-closed-outline"></ion-icon>`);
        } else {
          lockIcon.setAttribute("name", "lock-open-outline");
          lockText.textContent = "Lock";
          controls.style.pointerEvents = "auto";
          topControls.style.pointerEvents = "auto";
          videoContainer.style.pointerEvents = "auto";
          handleMainStateIcon(`<ion-icon name="lock-open-outline"></ion-icon>`);
        }
      }

      /* ---------- optional quality menu (only if /js/player.js exposes its
         hls.js instance globally, e.g. window.hls) — degrades gracefully ---------- */
      function tryPopulateQualityMenu() {
        const hls = window.hls || window.hlsInstance || video.hls;
        if (hls && Array.isArray(hls.levels) && hls.levels.length) {
          qualityHeader.style.display = "";
          qualityList.innerHTML = "";

          const autoItem = document.createElement("div");
          autoItem.className = "menu-item" + (hls.currentLevel === -1 ? " quality-active" : "");
          autoItem.textContent = "Auto";
          autoItem.addEventListener("click", () => {
            hls.currentLevel = -1;
            highlightQuality(-1);
            settingMenu.classList.remove("show-setting-menu");
          });
          qualityList.appendChild(autoItem);

          hls.levels.forEach((lvl, idx) => {
            const item = document.createElement("div");
            item.className = "menu-item" + (hls.currentLevel === idx ? " quality-active" : "");
            item.textContent = lvl.height ? `${lvl.height}p` : `Level ${idx + 1}`;
            item.addEventListener("click", () => {
              hls.currentLevel = idx;
              highlightQuality(idx);
              settingMenu.classList.remove("show-setting-menu");
              handleMainStateIcon(`<span style="font-size:1.2rem">${item.textContent}</span>`);
            });
            qualityList.appendChild(item);
          });
          return true;
        }
        return false;
      }

      function highlightQuality(current) {
        Array.from(qualityList.children).forEach((el, idx) => {
          el.classList.toggle("quality-active", idx === 0 ? current === -1 : (idx - 1) === current);
        });
      }

      let qualityCheckAttempts = 0;
      const qualityCheckInterval = setInterval(() => {
        qualityCheckAttempts++;
        if (tryPopulateQualityMenu() || qualityCheckAttempts >= 10) {
          clearInterval(qualityCheckInterval);
        }
      }, 1000);

      /* ---------- optional subtitle menu (native <track> elements only) ---------- */
      function populateSubtitleMenu() {
        const tracks = Array.from(video.textTracks || []);
        if (!tracks.length) {
          audioSubControl.style.display = "none";
          return;
        }
        audioSubControl.style.display = "";
        subtitleList.innerHTML = "";

        const offItem = document.createElement("div");
        offItem.className = "menu-item";
        offItem.textContent = "Off";
        offItem.addEventListener("click", () => {
          tracks.forEach((t) => (t.mode = "disabled"));
          highlightSubtitle(-1);
          subtitleMenu.classList.remove("show-setting-menu");
        });
        subtitleList.appendChild(offItem);

        tracks.forEach((t, idx) => {
          const item = document.createElement("div");
          item.className = "menu-item" + (t.mode === "showing" ? " sub-active" : "");
          item.textContent = t.label || t.language || `Track ${idx + 1}`;
          item.addEventListener("click", () => {
            tracks.forEach((tt, i) => (tt.mode = i === idx ? "showing" : "disabled"));
            highlightSubtitle(idx);
            subtitleMenu.classList.remove("show-setting-menu");
          });
          subtitleList.appendChild(item);
        });
      }

      function highlightSubtitle(current) {
        Array.from(subtitleList.children).forEach((el, idx) => {
          el.classList.toggle("sub-active", (idx - 1) === current);
        });
      }

      if (video.textTracks) {
        video.textTracks.addEventListener("addtrack", populateSubtitleMenu);
        video.textTracks.addEventListener("removetrack", populateSubtitleMenu);
      }

      /* ---------- native <video> events drive the custom UI ---------- */
      video.addEventListener("play", () => {
        isPlaying = true;
        playPauseBtn.innerHTML = `<ion-icon name="pause-outline"></ion-icon>`;
        mainState.classList.remove("show-state");
        handleMainStateIcon(`<ion-icon name="pause-outline"></ion-icon>`);
        loader.style.display = "none";
      });

      video.addEventListener("pause", () => {
        isPlaying = false;
        playPauseBtn.innerHTML = `<ion-icon name="play-outline"></ion-icon>`;
        showPausedUI();
      });

      video.addEventListener("ended", () => {
        currentTimeBar.style.width = "100%";
        showPausedUI();
      });

      video.addEventListener("loadedmetadata", () => {
        totalDurationEl.textContent = showDuration(video.duration);
        populateSubtitleMenu();
      });

      video.addEventListener("timeupdate", () => {
        if (video.duration) {
          currentTimeBar.style.width = (video.currentTime / video.duration) * 100 + "%";
        }
        currentDurationEl.textContent = showDuration(video.currentTime);
      });

      video.addEventListener("progress", () => {
        if (video.duration && video.buffered.length) {
          const end = video.buffered.end(video.buffered.length - 1);
          bufferBar.style.width = Math.min(100, (end / video.duration) * 100) + "%";
        }
      });

      video.addEventListener("waiting", () => { loader.style.display = "unset"; });
      video.addEventListener("playing", () => { loader.style.display = "none"; });
      video.addEventListener("canplay", () => { loader.style.display = "none"; });

      video.addEventListener("volumechange", () => {
        updateMuteIcon();
        currentVol.style.width = (video.muted ? 0 : video.volume * 100) + "%";
      });

      video.addEventListener("ratechange", () => {
        currentSpeedDisplay.textContent = video.playbackRate + "x";
      });

      // Fall back to a visible paused state if autoplay is blocked by the browser
      setTimeout(() => { if (video.paused) showPausedUI(); }, 300);

      /* ---------- UI event bindings (mouse, touch, keyboard) ---------- */
      document.addEventListener("keydown", handleShorthand);
      fullscreenBtn.addEventListener("click", toggleFullscreen);

      document.getElementById("speedControl").addEventListener("click", (e) => {
        e.stopPropagation();
        closeMenus(settingMenu);
        settingMenu.classList.toggle("show-setting-menu");
        const speedSection = document.querySelector('.setting-menu .menu-item[data-value]');
        if (speedSection) speedSection.scrollIntoView({ block: "nearest" });
      });

      document.getElementById("lockControl").addEventListener("click", handleLockScreen);

      audioSubControl.addEventListener("click", (e) => {
        e.stopPropagation();
        closeMenus(subtitleMenu);
        subtitleMenu.classList.toggle("show-setting-menu");
      });

      document.addEventListener("click", (e) => {
        if (!e.composedPath().includes(settingsBtn) && !e.composedPath().includes(settingMenu)) {
          settingMenu.classList.remove("show-setting-menu");
        }
        if (!e.composedPath().includes(audioSubControl)) {
          subtitleMenu.classList.remove("show-setting-menu");
        }
      });

      playPauseBtn.addEventListener("click", togglePlay);

      durationBar.addEventListener("click", navigate);
      durationBar.addEventListener("mousedown", (e) => {
        mouseDownProgress = true;
        navigate(e);
      });

      totalVol.addEventListener("mousedown", (e) => {
        mouseDownVol = true;
        handleVolume(e);
      });

      document.addEventListener("mouseup", () => {
        mouseDownProgress = false;
        mouseDownVol = false;
      });

      document.addEventListener("mousemove", handleMousemove);

      durationBar.addEventListener("mouseenter", () => { mouseOverDuration = true; });
      durationBar.addEventListener("mouseleave", () => {
        mouseOverDuration = false;
        hoverTime.style.width = 0;
        hoverDuration.textContent = "";
      });

      videoContainer.addEventListener("click", toggleMainState);
      videoContainer.addEventListener("fullscreenchange", () => {
        videoContainer.classList.toggle("fullscreen", !!document.fullscreenElement);
      });

      videoContainer.addEventListener("mouseleave", hideControls);
      videoContainer.addEventListener("mousemove", () => {
        controls.classList.add("show-controls");
        topControls.classList.add("show-controls");
        hideControls();
      });

      videoContainer.addEventListener("touchstart", (e) => {
        controls.classList.add("show-controls");
        topControls.classList.add("show-controls");
        touchClientX = e.changedTouches[0].clientX;
        const rect = currentTimeBar.getBoundingClientRect();
        touchPastDurationWidth = rect.width;
        touchStartTime = e.timeStamp;
      });

      videoContainer.addEventListener("touchend", () => {
        hideControls();
        touchClientX = 0;
        touchPastDurationWidth = 0;
        touchStartTime = 0;
      });

      videoContainer.addEventListener("touchmove", handleTouchNavigate);

      controls.addEventListener("mouseenter", () => {
        controls.classList.add("show-controls");
        topControls.classList.add("show-controls");
        isCursorOnControls = true;
      });
      controls.addEventListener("mouseleave", () => { isCursorOnControls = false; });

      topControls.addEventListener("mouseenter", () => {
        controls.classList.add("show-controls");
        topControls.classList.add("show-controls");
        isCursorOnControls = true;
      });
      topControls.addEventListener("mouseleave", () => { isCursorOnControls = false; });

      mainState.addEventListener("click", toggleMainState);
      mainState.addEventListener("animationend", () => {
        mainState.classList.remove("animate-state");
        if (video.paused) mainState.innerHTML = `<ion-icon name="play-outline"></ion-icon>`;
        if (document.pictureInPictureElement) mainState.innerHTML = `<ion-icon name="tv-outline"></ion-icon>`;
      });

      muteUnmuteBtn.addEventListener("click", toggleMuteUnmute);
      muteUnmuteBtn.addEventListener("mouseenter", () => {
        if (!video.muted) totalVol.classList.add("show");
        else totalVol.classList.remove("show");
      });
      muteUnmuteBtn.addEventListener("mouseleave", (e) => {
        if (e.relatedTarget != volumeWrap) totalVol.classList.remove("show");
      });

      forwardBtn.addEventListener("click", handleForward);
      forwardState.addEventListener("animationend", () => {
        forwardState.classList.remove("show-state");
        forwardState.classList.remove("animate-state");
      });

      backwardBtn.addEventListener("click", handleBackward);
      backwardState.addEventListener("animationend", () => {
        backwardState.classList.remove("show-state");
        backwardState.classList.remove("animate-state");
      });

      settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        closeMenus(settingMenu);
        settingMenu.classList.toggle("show-setting-menu");
      });

      speedButtons.forEach((btn) => btn.addEventListener("click", handlePlaybackRate));

      updateMuteIcon();
    })();
    </script>
</body>
</html>
