<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kineflex</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
            <h1 class="title" style="margin-bottom:0;">Kineflex</h1>
            <div id="accountStatus" style="font-size:0.95rem;"></div>
        </div>
        <p class="meta">Welcome to Kineflex. Use /movie/:id or /tv/:id/:season/:episode</p>
    </div>
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            KineflexAuth.mountAccountWidget('accountStatus');
        });
    </script>
</body>
</html>
