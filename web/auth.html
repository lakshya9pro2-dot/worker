<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Kineflex</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 4rem auto;
            padding: 2rem;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #e50914;
        }
        form { display: flex; flex-direction: column; gap: 1rem; }
        label { font-size: 0.9rem; color: #ccc; }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #e50914; border-color: #e50914; }
        .btn { width: 100%; margin-top: 0.5rem; }
        .status-message { min-height: 1.4rem; margin-top: 1rem; font-size: 0.95rem; }
        .status-message.success { color: #2ecc71; }
        .status-message.error { color: #e50914; }
        .already-in {
            text-align: center;
            padding: 2rem 0;
        }
        .skip-link { display: block; text-align: center; margin-top: 1.5rem; color: #999; font-size: 0.9rem; }
        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: #1f1f1f;
            border: none;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
            margin-bottom: 1.25rem;
        }
        .google-btn:hover { background: #f1f3f4; }
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0 1.25rem;
            color: #666;
            font-size: 0.8rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .auth-divider span { padding: 0 10px; }
    </style>
</head>
<body>
    <div class="container auth-container">
        <h1 class="title" style="font-size:2rem;">Kineflex</h1>

        <div id="signedInView" class="already-in" style="display:none;">
            <p class="meta" id="signedInMessage"></p>
            <button class="btn" id="continueBtn" type="button">Continue</button>
            <a href="#" class="skip-link" id="signOutLink">Sign out</a>
        </div>

        <div id="formView">
            <button type="button" id="googleBtn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <div class="auth-divider"><span>OR</span></div>

            <div class="tabs">
                <div class="tab active" id="signInTab">Sign In</div>
                <div class="tab" id="signUpTab">Sign Up</div>
            </div>

            <form id="authForm">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="submitBtn">Sign In</button>
            </form>
            <div class="status-message" id="statusMessage"></div>

            <a href="/" class="skip-link">Continue without an account (progress won't be saved)</a>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const redirectTo = params.get('redirect') || '/';

        const signInTab = document.getElementById('signInTab');
        const signUpTab = document.getElementById('signUpTab');
        const form = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('statusMessage');
        const passwordInput = document.getElementById('password');

        let mode = 'signin'; // or 'signup'

        function setMode(next) {
            mode = next;
            signInTab.classList.toggle('active', mode === 'signin');
            signUpTab.classList.toggle('active', mode === 'signup');
            submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
            passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
            statusEl.textContent = '';
            statusEl.className = 'status-message';
        }

        signInTab.addEventListener('click', () => setMode('signin'));
        signUpTab.addEventListener('click', () => setMode('signup'));

        function showStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + (isError ? 'error' : 'success');
        }

        function showSignedInView() {
            document.getElementById('formView').style.display = 'none';
            const view = document.getElementById('signedInView');
            view.style.display = 'block';
            document.getElementById('signedInMessage').textContent =
                `You're signed in as ${KineflexAuth.getEmail() || 'your account'}.`;
        }

        document.getElementById('googleBtn').addEventListener('click', () => {
            let target = redirectTo;
            if (target.startsWith('/')) {
                target = window.location.origin + target;
            }
            KineflexAuth.loginWithGoogle(target);
        });

        document.getElementById('continueBtn').addEventListener('click', () => {
            window.location.href = redirectTo;
        });
        document.getElementById('signOutLink').addEventListener('click', (e) => {
            e.preventDefault();
            KineflexAuth.signOut();
            document.getElementById('signedInView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            statusEl.className = 'status-message';
            statusEl.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            const result = mode === 'signin'
                ? await KineflexAuth.signIn(email, password)
                : await KineflexAuth.signUp(email, password);

            submitBtn.disabled = false;

            if (!result.ok) {
                showStatus(result.message, true);
                return;
            }

            if (mode === 'signin' || result.signedIn) {
                showStatus('Success! Redirecting…', false);
                setTimeout(() => { window.location.href = redirectTo; }, 500);
            } else {
                // Sign-up succeeded but needs email confirmation first.
                showStatus(result.message, false);
                setMode('signin');
            }
        });

        if (KineflexAuth.isSignedIn()) {
            showSignedInView();
        }
    </script>
</body>
</html>
