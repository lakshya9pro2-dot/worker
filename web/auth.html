<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Kineflex</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 4rem auto;
            padding: 2rem;
        }
        .btn-google {
            background: #ffffff;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid #ddd;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: background .2s, box-shadow .2s;
            border-radius: 4px;
            padding: 0.85rem 1rem;
            width: 100%;
        }
        .btn-google:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.25rem 0;
            color: #777;
            font-size: 0.8rem;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .auth-divider span {
            padding: 0 10px;
            font-weight: 600;
        }
        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            color: #999;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #fff;
            border-bottom: 2px solid #e50914;
        }
        form { display: flex; flex-direction: column; gap: 1rem; }
        label { font-size: 0.9rem; color: #ccc; }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #e50914; border-color: #e50914; }
        .btn { width: 100%; margin-top: 0.5rem; }
        .status-message { min-height: 1.4rem; margin-top: 1rem; font-size: 0.95rem; }
        .status-message.success { color: #2ecc71; }
        .status-message.error { color: #e50914; }
        .already-in {
            text-align: center;
            padding: 2rem 0;
        }
        .skip-link { display: block; text-align: center; margin-top: 1.5rem; color: #999; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container auth-container">
        <h1 class="title" style="font-size:2rem;">Kineflex</h1>

        <div id="signedInView" class="already-in" style="display:none;">
            <p class="meta" id="signedInMessage"></p>
            <button class="btn" id="continueBtn" type="button">Continue</button>
            <a href="#" class="skip-link" id="signOutLink">Sign out</a>
        </div>

        <div id="formView">
            <button type="button" class="btn-google" id="googleSignInBtn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.8.54-1.83.87-3.05.87-2.34 0-4.33-1.58-5.04-3.71H.95v2.33A8.997 8.997 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.96 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.95H.95A8.996 8.996 0 0 0 0 9c0 1.45.35 2.82.95 4.05l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A8.997 8.997 0 0 0 .95 4.95l3.01 2.33c.71-2.13 2.7-3.7 5.04-3.7z"/>
                </svg>
                Continue with Google
            </button>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <div class="tabs">
                <div class="tab active" id="signInTab">Sign In</div>
                <div class="tab" id="signUpTab">Sign Up</div>
            </div>

            <form id="authForm">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="btn" id="submitBtn">Sign In</button>
            </form>
            <div class="status-message" id="statusMessage"></div>

            <a href="/" class="skip-link">Continue without an account (progress won't be saved)</a>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const redirectTo = params.get('redirect') || '/';

        const signInTab = document.getElementById('signInTab');
        const signUpTab = document.getElementById('signUpTab');
        const form = document.getElementById('authForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusEl = document.getElementById('statusMessage');
        const passwordInput = document.getElementById('password');
        const googleBtn = document.getElementById('googleSignInBtn');

        let mode = 'signin';

        function setMode(next) {
            mode = next;
            signInTab.classList.toggle('active', mode === 'signin');
            signUpTab.classList.toggle('active', mode === 'signup');
            submitBtn.textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
            passwordInput.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
            statusEl.textContent = '';
            statusEl.className = 'status-message';
        }

        signInTab.addEventListener('click', () => setMode('signin'));
        signUpTab.addEventListener('click', () => setMode('signup'));

        googleBtn.addEventListener('click', () => {
            const returnUrl = (redirectTo && redirectTo !== '/')
                ? (redirectTo.startsWith('http') ? redirectTo : window.location.origin + redirectTo)
                : window.location.origin + '/';
            KineflexAuth.signInWithGoogle(returnUrl);
        });

        function showStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + (isError ? 'error' : 'success');
        }

        function showSignedInView() {
            document.getElementById('formView').style.display = 'none';
            const view = document.getElementById('signedInView');
            view.style.display = 'block';
            document.getElementById('signedInMessage').textContent =
                `You're signed in as ${KineflexAuth.getEmail() || 'your account'}.`;
        }

        document.getElementById('continueBtn').addEventListener('click', () => {
            window.location.href = redirectTo;
        });

        document.getElementById('signOutLink').addEventListener('click', async (e) => {
            e.preventDefault();
            await KineflexAuth.signOut();
            document.getElementById('signedInView').style.display = 'none';
            document.getElementById('formView').style.display = 'block';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            statusEl.className = 'status-message';
            statusEl.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            const result = mode === 'signin'
                ? await KineflexAuth.signIn(email, password)
                : await KineflexAuth.signUp(email, password);

            submitBtn.disabled = false;

            if (!result.ok) {
                showStatus(result.message, true);
                return;
            }

            if (mode === 'signin' || result.signedIn) {
                showStatus('Success! Redirecting…', false);
                setTimeout(() => { window.location.href = redirectTo; }, 500);
            } else {
                showStatus(result.message, false);
                setMode('signin');
            }
        });

        KineflexAuth.ready.then(() => {
            if (KineflexAuth.isSignedIn()) {
                showSignedInView();
            }
        });
    </script>
</body>
</html>
